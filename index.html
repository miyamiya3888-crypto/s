<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生物基礎 オリジナル模試ジェネレーター</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
        }

        .timer-badge {
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .question-text {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }

        .option-item:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }

        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        .text-input-container textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #f1f5f9;
            display: none;
        }

        .result-box.show {
            display: block;
        }

        .explanation {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #334155;
            white-space: pre-line;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-sub);
        }

        .nav-btn:hover {
            background: #f8fafc;
            color: var(--text-main);
        }

        .summary-card {
            text-align: center;
            padding: 40px 20px;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <header>
        <h1>生物基礎 オリジナル模試（毎回ランダム生成）</h1>
        <div class="timer-badge" id="timer">残り時間 30:00</div>
    </header>

    <div id="quiz-container">
        <div class="card">
            <div class="question-header">
                <span id="q-category">大問1</span>
                <span id="q-progress">問 1 / 8</span>
            </div>
            <div class="question-text" id="q-text">
                問題文がここに生成されます。
            </div>

            <div class="options-list" id="options-container"></div>

            <div class="text-input-container" id="text-input-container" style="display: none;">
                <textarea id="user-text-answer" placeholder="ここに記述解答を入力してください"></textarea>
            </div>

            <button class="btn-primary" id="submit-btn" onclick="checkAnswer()">解答を決定・採点</button>

            <div class="result-box" id="result-box">
                <strong id="result-status" style="font-size: 1.1rem;">正解！</strong>
                <div style="margin-top: 8px;">推定正答率: <span id="stat-accuracy" style="font-weight:bold;">--%</span></div>
                <div class="explanation" id="result-explanation">
                    ここに解説が表示されます。
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()" style="display:none;">前の問題へ</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()" style="display:none;">次の問題へ進む</button>
        </div>
    </div>

    <div class="card summary-card" id="summary-container" style="display: none;">
        <h2>模試終了・お疲れ様でした！</h2>
        <p>あなたの総合得点</p>
        <div class="score-display" id="final-score">0 / 8問正解</div>
        <p id="final-comment" style="color: var(--text-sub); margin-bottom: 25px;">「もう一度挑戦する」を押すと、全く新しいランダム問題が生成されます！</p>
        <button class="btn-primary" onclick="initQuiz()">もう一度挑戦する（新作問題を作成）</button>
    </div>
</div>

<script>
    let questionsData = [];
    let currentIdx = 0;
    let userAnswers = [];
    let timeLeft = 1800;
    let timerInterval;

    // ランダムな整数を作るヘルパー
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 毎回その場で「オリジナル問題」を動的に組み立てる関数
    function generateDynamicMock() {
        let generated = [];

        // 1. ミクロメーターの計算問題（数値ランダム）
        const micTarget = getRandomInt(0, 1) === 0 ? "対物ミクロメーターの1目盛り" : "接眼ミクロメーターの1目盛り";
        const scaleVal = getRandomInt(10, 50) * 2;
        generated.push({
            category: "大問1：細胞とミクロメーター",
            type: "choice",
            text: `問1 顕微鏡の観察において、接眼ミクロメーターの目盛りと対物ミクロメーターの目盛りを重ね合わせたところ、対物ミクロメーターの ${scaleVal} 目盛りと、接眼ミクロメーターの ${scaleVal + getRandomInt(5, 15)} 目盛りが一致した。この倍率における接眼ミクロメーター1目盛りの長さとして最も適当なものを、次の①～④の中から一つ選びなさい。ただし、対物ミクロメーターの1目盛りは 10 $\\mu m$ とする。`,
            options: [
                `① 約 ${( (scaleVal * 10) / (scaleVal + 5) ).toFixed(1)} $\\mu m$`,
                `② 約 ${( (scaleVal * 10) / (scaleVal + 8) ).toFixed(1)} $\\mu m$`,
                `③ 約 ${( (scaleVal * 10) / (scaleVal + 10) ).toFixed(1)} $\\mu m$`,
                `④ 約 ${( (scaleVal * 10) / (scaleVal + 12) ).toFixed(1)} $\\mu m$`
            ],
            answer: 2,
            accuracy: `${getRandomInt(45, 75)}%`,
            explanation: `正解：③\n【解説】対物ミクロメーターの1目盛りは10μmなので、全体で ${scaleVal * 10} μm です。これを接眼の目盛り数で割ることで1目盛りの長さを算出できます。`
        });

        // 2. 腎臓の再吸収量計算（物質名・数値をランダム化）
        const substances = [
            { name: "イヌリン", reabsorb: "まったく再吸収されない（100%濃縮）" },
            { name: "尿素", reabsorb: "一部が再吸収される" },
            { name: "グルコース", reabsorb: "すべて再吸収される（再吸収率100%）" }
        ];
        const sub = substances[getRandomInt(0, substances.length - 1)];
        const bloodConc = (Math.random() * 0.08 + 0.02).toFixed(3);
        generated.push({
            category: "大問2：体内環境と腎臓の働き",
            type: "choice",
            text: `問2 ヒトの腎臓における血漿成分のろ過と再吸収に関する記述である。原尿中の ${sub.name} の濃度が血漿中の濃度と比べてどのように扱われるか、またその特徴として最も適当なものを次から選びなさい。`,
            options: [
                `① 糸球体でろ過された後、細尿管で${sub.reabsorb}。`,
                `② 糸球体でろ過されず、すべてボーボン嚢に残る。`,
                `③ 腎孟から分泌されて尿中に大量に排出される。`,
                `④ すべてが毛細血管へ再吸収されて尿には一切含まれない。`
            ],
            answer: 0,
            accuracy: `${getRandomInt(50, 80)}%`,
            explanation: `正解：①\n【解説】${sub.name} は ${sub.reabsorb} ため、濃縮率は尿量と原尿量の比率を反映します。過去問頻出の計算・知識の融合問題です。`
        });

        // 3. ホルモン・自律神経の組み合わせ
        const hormoneList = [
            { h: "アドレナリン", organ: "副腎髄質", nerv: "交感神経の刺激" },
            { h: "糖質コルチコイド", organ: "副腎皮質", nerv: "脳下垂体前葉ホルモン（ACTH）の調節" },
            { h: "バソプレシン", organ: "脳下垂体後葉", nerv: "体液の浸透圧上昇による視床下部からの刺激" }
        ];
        const chosenH = hormoneList[getRandomInt(0, hormoneList.length - 1)];
        generated.push({
            category: "大問2：自律神経系と内分泌系",
            type: "choice",
            text: `問3 ヒトの体内環境を維持するホルモンである「${chosenH.h}」の分泌と調節に関する記述として最も適当なものを、次の①～④の中から一つ選びなさい。`,
            options: [
                `① ${chosenH.h}は${chosenH.organ}から分泌され、${chosenH.nerv}によって分泌が促進される。`,
                `② ${chosenH.h}はすい臓のランゲルハンス島A細胞から分泌され、血糖値を低下させる。`,
                `③ ${chosenH.h}の分泌は、自律神経系による調節を一切受けない。`,
                `④ ${chosenH.h}はタンパク質合成を抑制し、体温を急激に低下させる働きを持つ。`
            ],
            answer: 0,
            accuracy: `${getRandomInt(55, 85)}%`,
            explanation: `正解：①\n【解説】${chosenH.h}は ${chosenH.organ} から分泌され、${chosenH.nerv} を受けて放出されます。過去問の選択肢で頻出のひっかけパターンに注意しましょう。`
        });

        // 4. 酸素解離曲線に関する考察
        generated.push({
            category: "大問3：血液と酸素解離曲線",
            type: "choice",
            text: `問4 図に示されるような酸素解離曲線において、肺から組織へ運ばれた酸素のうち、酸素ヘモグロビンから解離して組織に供給される割合（酸素放出度）が変化する要因として誤っているものを次から選びなさい。`,
            options: [
                "① 組織における呼吸運動による二酸化炭素濃度の低下",
                "② 組織における細胞呼吸に伴うpH（水素イオン濃度）の低下",
                "③ 組織における活発な代謝による温度（体温）の上昇",
                "④ 肺と組織の間での酸素分圧の圧力差"
            ],
            answer: 0,
            accuracy: `${getRandomInt(40, 70)}%`,
            explanation: `正解：①\n【解説】組織では呼吸によって二酸化炭素濃度が「上昇」します。低下するのではなく上昇することでボーア効果が働き、酸素が解離しやすくなります。`
        });

        // 5. 免疫と生体防御（記述式）
        generated.push({
            category: "大問3：免疫と生体防御",
            type: "text",
            text: `問5 体液性免疫において、B細胞が抗原の刺激を受け、ヘルパーT細胞などの働きも受けて増殖し、大量の抗体を産生する細胞へと分化する。その細胞の名称を答えなさい。`,
            answerText: "形質細胞",
            accuracy: `${getRandomInt(60, 90)}%`,
            explanation: "【模範解答】形質細胞（抗体産生細胞）\n【解説】B細胞が活性化して変化する抗体を分泌する細胞を「形質細胞」と呼びます。記述式問題として頻出です。"
        });

        // 6. バイオームと植物の分布
        const biomes = ["照葉樹林", "夏緑樹林", "針葉樹林", "雨緑樹林"];
        const bName = biomes[getRandomInt(0, biomes.length - 1)];
        generated.push({
            category: "大問4：生態系とバイオーム",
            type: "choice",
            text: `問6 日本の代表的なバイオームの一つである「${bName}」の植生や気候に関する記述として最も適当なものを次から選びなさい。`,
            options: [
                `① ${bName}を構成する樹木は、冬季の低温や乾燥に適応した特有の形態や落葉性・常緑性を示す。`,
                `② ${bName}は北半球の高緯度地域にのみ見られ、地球上で最も樹種が豊富な森林である。`,
                `③ 年間を通じて降水量が極めて少なく、サバンナやステップのような草原が広がる。`,
                `④ 高山帯の森林限界を超える場所にのみ成立する極相林である。`
            ],
            answer: 0,
            accuracy: `${getRandomInt(65, 88)}%`,
            explanation: `正解：①\n【解説】バイオームごとの気候適応（常緑広葉樹、落葉広葉樹、針葉樹など）の特徴を問う典型的な問題です。`
        });

        // 7. 細胞周期とDNA量
        const dnaHours = getRandomInt(12, 24);
        generated.push({
            category: "大問1：細胞周期とDNA量",
            type: "choice",
            text: `問7 ある植物の根端の細胞分裂を観察したところ、細胞周期の総時間が ${dnaHours} 時間であった。間期（G1期・S期・G2期）が占める割合が全体の約 85% であるとき、S期（DNA合成期）の時間の目安として最も適当なものを次から選びなさい。`,
            options: [
                `① 約 ${(dnaHours * 0.25).toFixed(1)} 時間`,
                `② 約 ${(dnaHours * 0.50).toFixed(1)} 時間`,
                `③ 約 ${(dnaHours * 0.75).toFixed(1)} 時間`,
                `④ 約 ${(dnaHours * 0.90).toFixed(1)} 時間`
            ],
            answer: 0,
            accuracy: `${getRandomInt(50, 75)}%`,
            explanation: `正解：①\n【解説】細胞周期の時間配分計算です。一般にS期は全体の4分の1程度の時間を占めることが多く、配分比率から逆算して求めます。`
        });

        // 8. 生態系と環境保全
        generated.push({
            category: "大問4：生態系のバランス",
            type: "choice",
            text: `問8 生態系のバランスや物質循環に関する記述として正しいものを、次の①～④の中から一つ選びなさい。`,
            options: [
                "① 生態系におけるエネルギーの流動は一方向であり、生産者から消費者、分解者へと伝わる中で一部が熱として放出される。",
                "② 生態系内の窒素成分は、生物の死骸や排泄物から独立して自然に消失し、二度と再利用されない。",
                "③ 外来生物が侵入した場合、既存の食物連鎖や生物多様性への影響は全く起きない。",
                "④ 植生が成熟して極相（クライマックス）に達した森林は、環境の変化に対して永遠に変化しなくなる。"
            ],
            answer: 0,
            accuracy: `${getRandomInt(70, 92)}%`,
            explanation: "正解：①\n【解説】エネルギーは太陽から供給され、生物間を流れて最終的に熱として系外へ放出されます（物質は循環しますがエネルギーは循環しません）。"
        });

        return generated;
    }

    function initQuiz() {
        // 毎回新しくランダムなオリジナル問題を生成する
        questionsData = generateDynamicMock();
        currentIdx = 0;
        userAnswers = new Array(questionsData.length).fill(null);
        timeLeft = 1800;

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showSummary();
                return;
            }
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById('timer').innerText = `残り時間 ${m}:${s < 10 ? '0' : ''}${s}`;
        }, 1000);

        document.getElementById('summary-container').style.display = 'none';
        document.getElementById('quiz-container').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        const q = questionsData[currentIdx];
        document.getElementById('q-category').innerText = q.category;
        document.getElementById('q-progress').innerText = `問 ${currentIdx + 1} / ${questionsData.length}`;
        document.getElementById('q-text').innerText = q.text;

        const optionsContainer = document.getElementById('options-container');
        const textContainer = document.getElementById('text-input-container');
        const resultBox = document.getElementById('result-box');
        resultBox.classList.remove('show');

        if (q.type === 'choice') {
            optionsContainer.style.display = 'flex';
            textContainer.style.display = 'none';
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const isChecked = userAnswers[currentIdx] === idx ? 'checked' : '';
                optionsContainer.innerHTML += `
                    <label class="option-item">
                        <input type="radio" name="quiz-opt" value="${idx}" ${isChecked} onchange="saveChoice(${idx})">
                        <span>${opt}</span>
                    </label>
                `;
            });
        } else {
            optionsContainer.style.display = 'none';
            textContainer.style.display = 'block';
            document.getElementById('user-text-answer').value = userAnswers[currentIdx] || '';
        }

        document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'block' : 'none';
        document.getElementById('next-btn').style.display = currentIdx < questionsData.length - 1 ? 'block' : 'none';
    }

    function saveChoice(idx) {
        userAnswers[currentIdx] = idx;
    }

    function checkAnswer() {
        const q = questionsData[currentIdx];
        let isCorrect = false;

        if (q.type === 'choice') {
            const selected = userAnswers[currentIdx];
            if (selected === null) {
                alert("選択肢を一つ選んでください。");
                return;
            }
            isCorrect = (selected === q.answer);
        } else {
            const val = document.getElementById('user-text-answer').value.trim();
            if (!val) {
                alert("解答を入力してください。");
                return;
            }
            userAnswers[currentIdx] = val;
            isCorrect = val.includes("形質細胞") || val.includes("抗体産生細胞");
        }

        const resultBox = document.getElementById('result-box');
        const statusEl = document.getElementById('result-status');
        const accuracyEl = document.getElementById('stat-accuracy');
        const explEl = document.getElementById('result-explanation');

        if (isCorrect) {
            statusEl.innerText = "🎉 正解です！";
            statusEl.style.color = "var(--success)";
        } else {
            statusEl.innerText = "❌ 残念、不正解です";
            statusEl.style.color = "var(--error)";
        }

        accuracyEl.innerText = q.accuracy;
        explEl.innerText = q.explanation;
        resultBox.classList.add('show');
    }

    function nextQuestion() {
        if (currentIdx < questionsData.length - 1) {
            currentIdx++;
            loadQuestion();
        } else {
            showSummary();
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            loadQuestion();
        }
    }

    function showSummary() {
        clearInterval(timerInterval);
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('summary-container').style.display = 'block';

        let correctCount = 0;
        questionsData.forEach((q, idx) => {
            if (q.type === 'choice' && userAnswers[idx] === q.answer) {
                correctCount++;
            } else if (q.type === 'text' && userAnswers[idx] && (userAnswers[idx].includes("形質細胞") || userAnswers[idx].includes("抗体産生細胞"))) {
                correctCount++;
            }
        });
        document.getElementById('final-score').innerText = `${correctCount} / ${questionsData.length}問正解`;
    }

    // 初回起動
    initQuiz();
</script>

</body>
</html>
